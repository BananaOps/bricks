{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bricks.databaseSecretName" . }}
  labels:
    {{- include "bricks.labels" . | nindent 4 }}
type: Opaque
data:
  # Le jeton reste vide tant qu'il n'est pas fourni : le conteneur démarre
  # alors sur une base locale, ce qui convient à un essai mais pas au-delà.
  authToken: {{ .Values.database.authToken | b64enc | quote }}
{{- end }}
