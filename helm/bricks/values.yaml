# Default values for bricks.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

database:
  # URL libSQL de la base Turso.
  #
  # Turso par défaut, et non un fichier SQLite local : le conteneur tourne avec
  # readOnlyRootFilesystem, et plusieurs répliques partageant un fichier ne
  # partageraient rien du tout. Un fichier local suppose un volume et une seule
  # réplique.
  url: ""
  # Jeton d'authentification. Laissé vide, il est attendu dans existingSecret.
  authToken: ""
  # Secret déjà présent dans le cluster portant la clé `authToken`. Préférable :
  # le jeton ne transite alors ni par les valeurs du chart ni par l'historique.
  existingSecret: ""

env:
  # Origine autorisée par CORS. Inutile quand l'API sert l'interface — c'est le
  # cas de l'image — puisque le navigateur ne voit qu'une seule origine.
  allowedOrigin: ""

image:
  repository: bananaops/bricks
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

# Defaults comply with the Kubernetes Pod Security Standard "restricted" profile.
# The image ships a dedicated unprivileged user (UID/GID 65532) and never writes to disk.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  http:
    port: 8080
  annotations: {}

# L'API expose /healthz, qui interroge la base : une sonde rouge signale donc
# aussi bien un processus mort qu'une base injoignable.
livenessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

ingress:
  enabled: false
  className: traefik
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: bricks.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

gateway:
  enabled: false
  name: gateway-bricks
  namespace:
  pathType: PathPrefix
  annotations: {}
  hosts:
    - host: bricks.local
      paths:
        - path: /

openshift:
  enabled: false
  route:
    enabled: false
    labels: {}
    annotations: {}
    to:
      kind: Service
      weight: 100
    host: bricks.local
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
