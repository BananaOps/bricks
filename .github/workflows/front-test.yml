name: Front Test

on:
  pull_request:
    paths:
      - .github/workflows/front-test.yml
      - frontend/**

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Le build est déjà couvert par `npm run build`, mais le lancer ici fait
      # échouer la PR avant la release plutôt qu'au moment de publier l'image.
      - name: Build
        run: npm run build
