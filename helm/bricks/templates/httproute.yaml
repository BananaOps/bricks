{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bricks.fullname" . }}
  labels:
    {{- include "bricks.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      {{- with .Values.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
  hostnames:
    {{- range .Values.gateway.hosts }}
    - {{ .host | quote }}
    {{- end }}
  rules:
    {{- range .Values.gateway.hosts }}
    {{- range .paths }}
    - matches:
        - path:
            type: {{ $.Values.gateway.pathType }}
            value: {{ .path }}
      backendRefs:
        - name: {{ include "bricks.fullname" $ }}
          port: {{ $.Values.service.http.port }}
    {{- end }}
    {{- end }}
{{- end }}
