{{- if and .Values.openshift.enabled .Values.openshift.route.enabled -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "bricks.fullname" . }}
  labels:
    {{- include "bricks.labels" . | nindent 4 }}
    {{- with .Values.openshift.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.openshift.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ .Values.openshift.route.host }}
  to:
    kind: {{ .Values.openshift.route.to.kind }}
    name: {{ include "bricks.fullname" . }}
    weight: {{ .Values.openshift.route.to.weight }}
  port:
    targetPort: http
  {{- with .Values.openshift.route.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
