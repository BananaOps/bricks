name: Docker Test

on:
  pull_request:
    paths:
      - .github/workflows/docker-test.yml
      - Dockerfile
      - .dockerignore
      - backend/**
      - frontend/**

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:

      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Construction sans publication : la PR échoue si l'image ne se bâtit
      # plus, sans attendre le tag de release pour s'en apercevoir.
      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bananaops/bricks:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name bricks -p 8080:8080 bananaops/bricks:ci
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS localhost:8080/healthz
          # L'API doit servir l'interface compilée depuis la même image.
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          docker rm -f bricks
