name: Helm Test

on:
  pull_request:
    paths:
      - .github/workflows/helm-test.yml
      - helm/**

jobs:
  lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint
        run: helm lint helm/bricks

      # Les valeurs par défaut laissent Ingress, HPA, Gateway et Route inertes :
      # sans ce second passage, ces gabarits ne seraient jamais rendus en CI et
      # une erreur de syntaxe n'y apparaîtrait qu'au déploiement.
      - name: Lint with every optional resource enabled
        run: |
          helm lint helm/bricks \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set gateway.enabled=true \
            --set openshift.enabled=true \
            --set openshift.route.enabled=true \
            --set database.url=libsql://example.turso.io

  validate:
    name: Kubernetes schema
    runs-on: ubuntu-latest
    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests
        run: |
          helm template bricks helm/bricks \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set database.url=libsql://example.turso.io \
          | kubeconform -strict -summary
